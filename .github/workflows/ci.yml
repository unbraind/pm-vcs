name: CI
on:
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              # Docs and tracker data are test inputs; the self-host gate
              # also consumes every committed path. No inert exclusions.
              code=true
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  quick-shard:
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Expose local test commands
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build shard
        run: |-
          npm run build
          npm run build:test
      - name: Run quick shard
        run: node test/helpers/ci-shards.ts ${{ matrix.shard }}/8
  coverage-shard:
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Expose local test commands
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build coverage shard
        run: |-
          npm run build
          npm run build:test
      - name: Collect coverage shard
        run: |
          set -euo pipefail
          df -BG /
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( available_kb < 20971520 )); then
            printf 'Release gate stopped: fewer than 20 GiB free on root (%s KiB available).\n' "${available_kb}" >&2
            exit 1
          fi
          gate_tmp="$(mktemp -d "${RUNNER_TEMP}/pm-vcs-npm.XXXXXXXX")"
          gate_memory=""
          # Every crash cut still uses native syscalls. Bound memory-backed
          # storage to this matrix; other acceptance fixtures stay on disk.
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            if memory_kb="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $4 }')" && [[ "${memory_kb}" =~ ^[0-9]+$ ]] && (( memory_kb >= 2097152 )); then
              gate_memory="$(mktemp -d /dev/shm/pm-vcs-crashes.XXXXXXXX)"
              export PM_VCS_CRASH_TMPDIR="${gate_memory}"
            fi
          fi
          storage_report() {
            printf 'gate storage %s\n' "$1"
            df -Pk "${gate_tmp}"
            df -Pi "${gate_tmp}"
            du -sk -- "${gate_tmp}"
            if [ -n "${gate_memory}" ]; then du -sk -- "${gate_memory}"; fi
            if [ -d coverage ]; then du -sk -- coverage; fi
          }
          trap 'gate_status=$?; storage_report before-cleanup || true; rm -rf -- "${gate_tmp}"; if [ -n "${gate_memory}" ]; then rm -rf -- "${gate_memory}"; fi; df -Pk "${RUNNER_TEMP}" || true; df -Pi "${RUNNER_TEMP}" || true; exit "${gate_status}"' EXIT
          export TMPDIR="${gate_tmp}"
          storage_report before-gate || true
          NPM_CONFIG_USERCONFIG=/dev/null node scripts/coverage-gate.ts --shard ${{ matrix.shard }}/8 --output coverage/shard-${{ matrix.shard }}
      - name: Upload raw hits
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}/hits.json
          if-no-files-found: error
          retention-days: 7
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PM_TEST_DEPTH: quick
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi
      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --check-only --strict-exit --require-merge-drivers
      - name: Non-coverage release gates
        shell: bash
        run: |
          set -euo pipefail
          df -BG /
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( available_kb < 20971520 )); then
            printf 'Release gate stopped: fewer than 20 GiB free on root (%s KiB available).\n' "${available_kb}" >&2
            exit 1
          fi
          gate_tmp="$(mktemp -d "${RUNNER_TEMP}/pm-vcs-npm.XXXXXXXX")"
          gate_memory=""
          # Every crash cut still uses native syscalls. Bound memory-backed
          # storage to this matrix; other acceptance fixtures stay on disk.
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            if memory_kb="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $4 }')" && [[ "${memory_kb}" =~ ^[0-9]+$ ]] && (( memory_kb >= 2097152 )); then
              gate_memory="$(mktemp -d /dev/shm/pm-vcs-crashes.XXXXXXXX)"
              export PM_VCS_CRASH_TMPDIR="${gate_memory}"
            fi
          fi
          storage_report() {
            printf 'gate storage %s\n' "$1"
            df -Pk "${gate_tmp}"
            df -Pi "${gate_tmp}"
            du -sk -- "${gate_tmp}"
            if [ -n "${gate_memory}" ]; then du -sk -- "${gate_memory}"; fi
            if [ -d coverage ]; then du -sk -- coverage; fi
          }
          trap 'gate_status=$?; storage_report before-cleanup || true; rm -rf -- "${gate_tmp}"; if [ -n "${gate_memory}" ]; then rm -rf -- "${gate_memory}"; fi; df -Pk "${RUNNER_TEMP}" || true; df -Pi "${RUNNER_TEMP}" || true; exit "${gate_status}"' EXIT
          export TMPDIR="${gate_tmp}"
          storage_report before-gate || true
          NPM_CONFIG_USERCONFIG=/dev/null npm run typecheck && npm run build && npm run lint && npm run duplicates && npm run docstring && npm run accept:native-toon && npm run accept:stat-cache && npm run accept:self-host && npm run audit:prod && npm run audit:identities && npm run pack:dry-run && npm run pack:check && npm run changelog:check && npm run verify:release-changelog-date && npm run verify:release-publish-attestation
      - name: Bun and bunx install smoke
        run: |
          bun install --no-save
          bunx --bun --package @unbrained/pm-cli@2026.11.13 pm --version
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
  coverage-merge:
    needs:
      - changes
      - coverage-shard
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PM_TEST_DEPTH: quick
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download shard hits
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-shard-*
          path: coverage/shards
      - name: Merge exact hits and enforce thresholds
        run: node scripts/coverage-gate.ts --merge 8 coverage/shards/coverage-shard-*/hits.json
      - name: Keep merged coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-merged
          path: coverage/merged.json
          if-no-files-found: warn
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
      - name: Install dependencies
        run: npm ci
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --check-only --strict-exit --require-merge-drivers
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
      - name: Check documentation and tracker changes
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run changelog:check
          npm run verify:release-changelog-date
          npm run audit:identities
          npm run accept:self-host
          npm run pack:check
      - name: Require every prerequisite
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUICK: ${{ needs.quick-shard.result }}
          RELEASE: ${{ needs.release-gate.result }}
          COVERAGE: ${{ needs.coverage-merge.result }}
        run: |-
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then
            if [ "$NODE_VERSION" = 22 ]; then test "$QUICK" = success;
            else test "$RELEASE" = success; test "$COVERAGE" = success; fi
          fi
    needs:
      - changes
      - quick-shard
      - release-gate
      - coverage-merge
    if: ${{ always() }}

  windows-acceptance-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              # Docs and tracker data are test inputs; the self-host gate
              # also consumes every committed path. No inert exclusions.
              code=true
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --check-only --strict-exit --require-merge-drivers

      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: npm run changelog:check

      - name: Verify the installed PM CLI launcher
        if: steps.changes.outputs.code == 'true'
        run: node scripts/accept-native-toon.ts --init-only

      - name: Build Windows storage acceptance
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Verify Windows GC apply on a non-git tracker
        if: steps.changes.outputs.code == 'true'
        run: node --test --test-concurrency=1 --test-name-pattern="Windows GC|native root case" test/durability.test.ts test/ref-publication-recovery.test.ts
