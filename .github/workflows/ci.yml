name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Linux jobs run on the fleet's local, ephemeral runners (label pm-local) when the repository variable
# PM_LOCAL_RUNNER is 'on'; fork pull requests always stay on GitHub-hosted runners. Unset or 'off': ubuntu-latest.
# A new push to a pull request supersedes its earlier CI run: cancel it instead of letting both hold runners.
# Pushes to main and manual runs get a group of their own, so they never wait for or cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ (vars.PM_LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact pin: setup-bun resolves floating versions via an
          # unauthenticated api.github.com tag listing, which GitHub-hosted
          # runners routinely get 503/rate-limited on (broke this repo's CI
          # 3 runs in a row). An exact version downloads directly instead.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --check-only --strict-exit --require-merge-drivers

      - name: Full npm release gate
        shell: bash
        run: |
          set -euo pipefail
          df -BG /
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( available_kb < 20971520 )); then
            printf 'Release gate stopped: fewer than 20 GiB free on root (%s KiB available).\n' "${available_kb}" >&2
            exit 1
          fi
          gate_tmp="$(mktemp -d "${RUNNER_TEMP}/pm-vcs-npm.XXXXXXXX")"
          gate_memory=""
          # Every crash cut still uses native syscalls. Bound memory-backed
          # storage to this matrix; other acceptance fixtures stay on disk.
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            if memory_kb="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $4 }')" && [[ "${memory_kb}" =~ ^[0-9]+$ ]] && (( memory_kb >= 2097152 )); then
              gate_memory="$(mktemp -d /dev/shm/pm-vcs-crashes.XXXXXXXX)"
              export PM_VCS_CRASH_TMPDIR="${gate_memory}"
            fi
          fi
          storage_report() {
            printf 'gate storage %s\n' "$1"
            df -Pk "${gate_tmp}"
            df -Pi "${gate_tmp}"
            du -sk -- "${gate_tmp}"
            if [ -n "${gate_memory}" ]; then du -sk -- "${gate_memory}"; fi
            if [ -d coverage ]; then du -sk -- coverage; fi
          }
          trap 'gate_status=$?; storage_report before-cleanup || true; rm -rf -- "${gate_tmp}"; if [ -n "${gate_memory}" ]; then rm -rf -- "${gate_memory}"; fi; df -Pk "${RUNNER_TEMP}" || true; df -Pi "${RUNNER_TEMP}" || true; exit "${gate_status}"' EXIT
          export TMPDIR="${gate_tmp}"
          storage_report before-gate || true
          NPM_CONFIG_USERCONFIG=/dev/null npm run release:check

      - name: Full Bun release gate
        shell: bash
        run: |
          set -euo pipefail
          df -BG /
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( available_kb < 20971520 )); then
            printf 'Release gate stopped: fewer than 20 GiB free on root (%s KiB available).\n' "${available_kb}" >&2
            exit 1
          fi
          gate_tmp="$(mktemp -d "${RUNNER_TEMP}/pm-vcs-bun.XXXXXXXX")"
          gate_memory=""
          # Every crash cut still uses native syscalls. Bound memory-backed
          # storage to this matrix; other acceptance fixtures stay on disk.
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            if memory_kb="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $4 }')" && [[ "${memory_kb}" =~ ^[0-9]+$ ]] && (( memory_kb >= 2097152 )); then
              gate_memory="$(mktemp -d /dev/shm/pm-vcs-crashes.XXXXXXXX)"
              export PM_VCS_CRASH_TMPDIR="${gate_memory}"
            fi
          fi
          storage_report() {
            printf 'gate storage %s\n' "$1"
            df -Pk "${gate_tmp}"
            df -Pi "${gate_tmp}"
            du -sk -- "${gate_tmp}"
            if [ -n "${gate_memory}" ]; then du -sk -- "${gate_memory}"; fi
            if [ -d coverage ]; then du -sk -- coverage; fi
          }
          trap 'gate_status=$?; storage_report before-cleanup || true; rm -rf -- "${gate_tmp}"; if [ -n "${gate_memory}" ]; then rm -rf -- "${gate_memory}"; fi; df -Pk "${RUNNER_TEMP}" || true; df -Pi "${RUNNER_TEMP}" || true; exit "${gate_status}"' EXIT
          export TMPDIR="${gate_tmp}"
          storage_report before-gate || true
          bun run release:check
          bun test --timeout 120000 ./test/tracker-lenses.test.ts ./test/change-bundles.test.ts

      # The gate prints percentages but not which branch was missed, and a
      # coverage result that reproduces only on a runner is otherwise undebuggable
      # from a local checkout. Keeping the lcov turns "99.49% on model.ts" into a
      # specific BRDA line.
      - name: Keep the coverage report when the gate fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-node-${{ matrix.node-version }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Bun can install the package graph
        run: bun install --no-save

  windows-acceptance-launcher:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the installed PM CLI launcher
        run: node scripts/accept-native-toon.ts --init-only

      - name: Build Windows storage acceptance
        run: npm run build

      - name: Verify Windows GC apply on a non-git tracker
        run: node --test --test-concurrency=1 --test-name-pattern="Windows GC|native root case" test/durability.test.ts test/ref-publication-recovery.test.ts
