name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact pin: setup-bun resolves floating versions via an
          # unauthenticated api.github.com tag listing, which GitHub-hosted
          # runners routinely get 503/rate-limited on (broke this repo's CI
          # 3 runs in a row). An exact version downloads directly instead.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Verify pm project integrity and merge safety
        shell: bash
        run: |
          set -euo pipefail
          # `pm validate` is deliberately NOT the command here. After a same-field merge
          # conflict the field-aware driver writes a marker-free .toon that already holds
          # the winning value and records the discarded peer value in a clone-local
          # receipt. That file is valid TOON, so `pm validate` returns ok:true while
          # another agent's edit has been silently dropped. `pm health` is the only
          # surface that goes red, via integrity.counts.pending_merge_decisions.
          #
          # --strict-exit is load-bearing: a bare `pm health` exits 0 EVEN WHEN ok:false,
          # so without this flag the step is a no-op that always passes.
          #
          # A fresh runner checkout has no merge drivers installed. That is a warn, not a
          # failure (upstream GH-815), so this gate does not need `pm merge install`.
          ./node_modules/.bin/pm health --strict-exit

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage gate
        run: npm run coverage

      # The gate prints percentages but not which branch was missed, and a
      # coverage result that reproduces only on a runner is otherwise undebuggable
      # from a local checkout. Keeping the lcov turns "99.49% on model.ts" into a
      # specific BRDA line.
      - name: Keep the coverage report when the gate fails
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-lcov-node-${{ matrix.node-version }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Prove materialized files become metadata-only
        run: npm run accept:stat-cache

      - name: Prove the self-host bundle matches the committed source
        run: npm run accept:self-host

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify Bun can install the package graph
        run: bun install --no-save

  windows-acceptance-launcher:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the installed PM CLI launcher
        run: node scripts/accept-native-toon.ts --init-only
