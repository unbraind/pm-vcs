name: Daily Release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write
  # Lets the merge wait approve a CI run that GitHub parked on `action_required`
  # for the release PR. Best-effort: when the token may not approve, the run is
  # still reported with its URL so a maintainer can approve it once.
  actions: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TIMEZONE: Europe/Vienna
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Decide release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(git tag --sort=-creatordate | head -n 1 || true)"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag"..HEAD -- .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "No changes since $latest_tag; skipping release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_date="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          base_tag="v${release_date}"
          max_suffix=-1
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$base_tag" ]]; then
              (( max_suffix < 0 )) && max_suffix=0
              continue
            fi
            if [[ "$existing_tag" == "$base_tag-"* ]]; then
              suffix="${existing_tag#"$base_tag-"}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > max_suffix )); then
                max_suffix="$suffix"
              fi
            fi
          done < <(git tag -l "${base_tag}*")

          if (( max_suffix >= 0 )); then
            tag="${base_tag}-$((max_suffix + 1))"
          else
            tag="$base_tag"
          fi

          version_core="${tag#v}"
          year="${version_core%%.*}"
          version_tail="${version_core#*.}"
          month="${version_tail%%.*}"
          day_and_suffix="${version_tail#*.}"
          day="${day_and_suffix%%-*}"
          suffix="${day_and_suffix#"$day"}"
          npm_version="$((10#$year)).$((10#$month)).$((10#$day))${suffix}"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          # The heading date is derived from the version the tag already encodes,
          # not from the clock, so a release can never publish a version whose
          # changelog heading names a different day than the version itself.
          printf 'release_iso_date=%04d-%02d-%02d\n' "$((10#$year))" "$((10#$month))" "$((10#$day))" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update release version
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ steps.decide.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          node -e "const fs=require('node:fs');const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;for(const file of ['manifest.json']){if(!fs.existsSync(file))continue;const json=JSON.parse(fs.readFileSync(file,'utf8'));json.version=version;fs.writeFileSync(file,JSON.stringify(json,null,2)+'\n');}for(const file of ['index.ts']){if(!fs.existsSync(file))continue;const source=fs.readFileSync(file,'utf8');const next=source.replace(/^  version:\s*[\"'][^\"']+[\"']/m,'  version: \"'+version+'\"');if(next!==source)fs.writeFileSync(file,next);}"
          npm run build

      - name: Generate changelog and release notes
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx pm-changelog --pm-root .agents/pm --mode replace --output CHANGELOG.md --all-release-tags --release-version-from-package --date-from-version --date ${{ steps.decide.outputs.release_iso_date }} --item-url-base https://github.com/unbraind/pm-vcs/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm --pm-arg --output-budget --pm-arg 999999 --github-step-summary
          # Deliberately a DETERMINISM assertion, not a currency check. It runs
          # against the file the line above just wrote, so it cannot prove the
          # committed changelog was current - only that a second render of the
          # same inputs is byte-identical, which is what makes the PR-time
          # changelog:check trustworthy. Currency is gated in ci.yml, before the
          # release; here there is nothing to be current against, because this
          # job is what creates the new release section.
          npx pm-changelog --pm-root .agents/pm --mode replace --output CHANGELOG.md --all-release-tags --release-version-from-package --date-from-version --date ${{ steps.decide.outputs.release_iso_date }} --item-url-base https://github.com/unbraind/pm-vcs/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm --pm-arg --output-budget --pm-arg 999999 --check
          npx pm-changelog --pm-root .agents/pm --stdout --since-previous-tag --until-release-tag --release-version-from-package --date-from-version --date ${{ steps.decide.outputs.release_iso_date }} --item-url-base https://github.com/unbraind/pm-vcs/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm --pm-arg --output-budget --pm-arg 999999 > RELEASE_NOTES.md

      - name: Run release checks
        if: steps.decide.outputs.should_release == 'true'
        run: npm run release:check

      - name: Commit release files
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(package.json package-lock.json manifest.json CHANGELOG.md)
          [[ -f index.ts ]] && paths+=(index.ts)
          [[ -d src ]] && paths+=(src)
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Release files are already current; tagging existing commit."
          else
            git commit -m "Release ${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}"
          fi

      # Refuse non-main release runs BEFORE publishing. `github.ref` is the
      # authoritative workflow trigger ref: schedule -> refs/heads/main;
      # workflow_dispatch from main -> refs/heads/main; workflow_dispatch from a
      # feature branch -> refs/heads/<feature> (refused here). Checking the
      # trigger ref (rather than git topology) reliably distinguishes a feature
      # branch from main, which commit-topology checks cannot do (a feature
      # branch off main is also a descendant of origin/main).
      - name: Check release ref
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Refusing to release from non-main ref ('$GITHUB_REF'). Run the release workflow from main."
            exit 1
          fi

      # Persist validated release metadata through the repository's protected
      # branch policy before publishing an immutable npm artifact. A stable
      # branch name lets a failed run update/reuse its open release PR, while
      # the exact remote SHA lease prevents overwriting another actor's work.
      # Ported from pm-beads's release.yml: main must already contain the
      # release commit before npm publish runs - the invariant the old
      # publish-then-push ordering violated. pm-vcs published 2026.8.10 to
      # npm, then `git push origin HEAD:main` was rejected with GH006 by the
      # protected branch, and `set -e` killed the job before the tag push, so
      # npm ended up ahead of git (main still at 2026.8.7, no v2026.08.10 tag).
      #
      # The merge wait below IMPROVES on pm-context. pm-context polls
      # `gh pr view --json mergeStateStatus` and merges when it reads
      # CLEAN/HAS_HOOKS/UNSTABLE. That deadlocked pm-changelog's release PR
      # #133 for the full 30-minute deadline: it read `BLOCKED` with an empty
      # `statusCheckRollup` ("settling: none; failing: none") even though
      # `test (22)` and `test (26)` had both already succeeded on the PR's head
      # commit - GitHub's computed mergeStateStatus lagged the real check
      # state, so a "read a state, then decide" loop waited forever for a state
      # that never updated. A human had to merge it by hand.
      #
      # This step replaces that state poll with "attempt the merge, let GitHub
      # be the authority": before each attempt it resolves any unresolved
      # review threads (required_conversation_resolution is on, so an advisory
      # bot comment from Sourcery/cubic/CodeRabbit would otherwise block the
      # release forever), then it simply calls the merge endpoint. A
      # successful PUT is proof the branch-protection rules were satisfied - no
      # inference needed; a failed PUT (405 = checks not ready, 409 = SHA
      # moved) is proof they were not, and is retried until the deadline.
      #
      # The required-check list itself cannot be read here:
      # /branches/main/protection/required_status_checks is
      # administration-scoped, and the built-in GITHUB_TOKEN has no
      # administration permission (there is no such key in the `permissions:`
      # block, so it cannot be granted). It answers "Resource not accessible by
      # integration" (HTTP 403) on every run, so deriving the wait from the
      # exact required contexts is impossible from this workflow. The merge
      # attempt sidesteps that entirely: GitHub evaluates the full protection
      # rule set server-side and either accepts or refuses the merge.
      #
      # mergeStateStatus is still read, but only for two purposes:
      #   - the two fatal, unrecoverable states DIRTY (conflict) and BEHIND
      #     (stale base), which retrying cannot fix and so fail at once;
      #   - the deadline-expiry message, so a doomed release names the checks
      #     still settling or failing and stays diagnosable.
      # The merge DECISION is never derived from mergeStateStatus - only the
      # merge API call decides.
      - name: Merge release metadata through protected PR
        if: steps.decide.outputs.should_release == 'true'
        id: release_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.decide.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$RELEASE_BASE_SHA" ]]; then
            echo "::error::main advanced from ${RELEASE_BASE_SHA} to ${current_main_sha} while preparing the release. Retry from the new main head."
            exit 1
          fi

          release_branch="release/${RELEASE_TAG#v}"
          release_commit="$(git rev-parse HEAD)"
          if [[ "$release_commit" == "$current_main_sha" ]]; then
            echo "Release metadata is already present on main; resuming the publish/tag transaction."
            if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
              git push origin --delete "$release_branch"
            fi
            {
              echo "merged_sha=$current_main_sha"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/${release_branch}" | cut -f1)"
          if [[ -n "$remote_branch_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${release_branch}:${remote_branch_sha}" \
              origin "HEAD:refs/heads/${release_branch}"
          else
            git push origin "HEAD:refs/heads/${release_branch}"
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$release_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "Release pm-vcs ${RELEASE_TAG}" \
              --body "Automated daily release metadata for \`${RELEASE_TAG}\`. The release gate passed before this PR was created; npm publication and tagging remain blocked until this protected PR is merged.")"
            pr_number="${pr_url##*/}"
          fi

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          deadline=$(( SECONDS + 1800 ))
          awaiting_approval=0
          merge_err="$(mktemp)"
          pr_view_err="$(mktemp)"
          merged_sha=""
          while :; do
            # Read mergeStateStatus + statusCheckRollup only to detect the
            # fatal DIRTY/BEHIND states and to keep the deadline message
            # diagnosable. The merge decision is NOT derived from this state
            # (see the step-level comment above): the merge API call is the
            # authority. `set -e` is active, so an unguarded `gh pr view`
            # would abort the whole step on a transient 5xx/rate limit - a
            # failed read is not information about the PR, so it is treated as
            # an unrecognised state and retried.
            pr_state="$(gh pr view "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus,statusCheckRollup \
              --jq '{merge_state: (.mergeStateStatus // "UNKNOWN"),
                     unsettled: [.statusCheckRollup[]?
                                 | {name: (.name // .context),
                                    state: (.conclusion // .state // .status // "PENDING")}
                                 | select((.state | IN("SUCCESS", "NEUTRAL", "SKIPPED",
                                                       "FAILURE", "ERROR", "TIMED_OUT",
                                                       "CANCELLED", "ACTION_REQUIRED",
                                                       "STARTUP_FAILURE", "STALE")) | not)
                                 | .name],
                     failing: [.statusCheckRollup[]?
                               | {name: (.name // .context),
                                  state: (.conclusion // .state // .status // "PENDING")}
                               | select(.state | IN("FAILURE", "ERROR", "TIMED_OUT",
                                                    "CANCELLED", "ACTION_REQUIRED",
                                                    "STARTUP_FAILURE", "STALE"))
                               | .name]}' 2>"$pr_view_err")" || pr_state=""
            if [[ -z "$pr_state" ]]; then
              echo "Could not read PR #${pr_number} (retrying): $(tr '\n' ' ' < "$pr_view_err")"
              merge_state="UNKNOWN"
              unsettled="github api unavailable"
              failing=""
            else
              merge_state="$(jq -r '.merge_state' <<< "$pr_state")"
              unsettled="$(jq -r '.unsettled | join(", ")' <<< "$pr_state")"
              failing="$(jq -r '.failing | join(", ")' <<< "$pr_state")"
            fi

            case "$merge_state" in
              DIRTY | BEHIND)
                echo "::error::Release PR #${pr_number} is ${merge_state}; it conflicts with main or its base moved. Retry the release from the new main head."
                exit 1
                ;;
            esac

            # required_conversation_resolution is enabled, so any unresolved
            # review thread blocks the merge forever. Advisory bot reviewers
            # (Sourcery, cubic, CodeRabbit) routinely open threads as a
            # confidence signal; resolve every unresolved thread on this
            # release PR before each attempt so a bot comment cannot dead-end
            # the daily release. Only BOT-authored threads on this PR are
            # resolved, and only when EVERY comment on the thread is bot-
            # authored: a human reply on a bot-opened thread must keep
            # blocking. Clearing a human reviewer's thread would remove the
            # very protection required_conversation_resolution provides.
            unresolved="$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved comments(first:100){totalCount nodes{author{login __typename}}}}}}}}' \
              -F o="$owner" -F r="$repo" -F n="$pr_number" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]?
                    | select(.isResolved==false)
                    | select(.comments.totalCount ==
                             ([.comments.nodes[]?] | length))
                    | select([.comments.nodes[]?.author.__typename]
                             | length > 0 and all(. == "Bot"))
                    | .id' 2>/dev/null || true)"
            if [[ -n "$unresolved" ]]; then
              while IFS= read -r thread_id; do
                [[ -z "$thread_id" ]] && continue
                gh api graphql \
                  -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' \
                  -F t="$thread_id" >/dev/null 2>&1 || true
              done <<< "$unresolved"
            fi

            # Attempt the merge and let GitHub be the authority. A successful
            # PUT is proof the branch-protection rules were satisfied; a
            # failure (405 = checks not ready, 409 = SHA moved) is proof they
            # were not. No state inference in between.
            merge_out="$(gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
              -f merge_method=rebase \
              -f sha="$release_commit" \
              2>"$merge_err")" && merge_rc=0 || merge_rc=$?
            if (( merge_rc == 0 )); then
              merged_sha="$(jq -r '.sha // empty' <<< "$merge_out" 2>/dev/null || true)"
              if [[ -n "$merged_sha" && "$merged_sha" != "null" ]]; then
                echo "Merged release PR #${pr_number} via merge API (state was ${merge_state})."
                break
              fi
              # Merge reported success but no sha - treat as transient, retry.
              echo "Merge returned no sha; retrying: $(tr '\n' ' ' < "$merge_err")"
              merged_sha=""
            else
              echo "Merge attempt refused (state: ${merge_state}; settling: ${unsettled:-none}; failing: ${failing:-none}): $(tr '\n' ' ' < "$merge_err")"

              # A run parked on `action_required` is awaiting manual approval and
              # will never start on its own. It is invisible in statusCheckRollup,
              # so without this it is indistinguishable from a required check that
              # failed: the loop just logs "settling: none" until the deadline.
              # pm-changelog's release PR #133 parked exactly this way on
              # 2026-08-10 (attempt 1 conclusion `action_required` at 04:54:24Z,
              # policy `first_time_contributors`, and `github-actions[bot]` had no
              # merged PR in that repo yet). A human re-ran it at 05:36Z, 12
              # minutes after the release had already given up. Try to approve it -
              # the token often may not, which is harmless - and always surface the
              # run so the wait is diagnosable.
              pending_runs="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${release_commit}&per_page=100" \
                --jq '.workflow_runs[]? | select(.conclusion=="action_required" or .status=="waiting") | .id' \
                2>/dev/null || true)"
              if [[ -n "$pending_runs" ]]; then
                while IFS= read -r run_id; do
                  [[ -z "$run_id" ]] && continue
                  echo "::warning::CI run ${run_id} for this release PR is awaiting workflow approval: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" \
                    >/dev/null 2>&1 \
                    && echo "Approved workflow run ${run_id}; its checks can now report." \
                    || echo "Could not approve run ${run_id} with this token; a maintainer must approve it once."
                done <<< "$pending_runs"
                awaiting_approval=1
              fi
            fi

            if (( SECONDS >= deadline )); then
              if (( awaiting_approval == 1 )); then
                echo "::error::Release PR #${pr_number} did not merge within 30 minutes because its CI run is awaiting workflow approval (last state: ${merge_state}). Approve the run linked above once; this repository requires approval for a contributor that has no merged PR yet. Nothing was published or tagged."
              else
                echo "::error::Release PR #${pr_number} did not merge within 30 minutes (last state: ${merge_state}; still settling: ${unsettled:-none}; failing: ${failing:-none}). A required check failed or never reported, or a required review is missing; not merging or publishing."
              fi
              exit 1
            fi
            sleep 20
          done
          rm -f "$merge_err" "$pr_view_err"

          if [[ -z "$merged_sha" || "$merged_sha" == "null" ]]; then
            echo "::error::GitHub did not return the merged main SHA for release PR #${pr_number}."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
            git push origin --delete "$release_branch"
          fi
          {
            echo "merged_sha=$merged_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"
          echo "Merged release metadata PR #${pr_number} at ${merged_sha}." >> "$GITHUB_STEP_SUMMARY"

      # The release PR can only contain the prepared release commit because the
      # base SHA is checked immediately before creation. Re-check the exact
      # merged main commit anyway so npm always receives byte-for-byte validated
      # repository state, and fail safely before publication if main moved.
      - name: Verify merged release
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          MERGED_SHA: ${{ steps.release_pr.outputs.merged_sha }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$MERGED_SHA" ]]; then
            echo "::error::main advanced from merged release ${MERGED_SHA} to ${actual_sha} before publication. Retry to rebuild release metadata on the new head."
            exit 1
          fi

          actual_version="$(npm pkg get version | tr -d '"')"
          if [[ "$actual_version" != "$NPM_VERSION" ]]; then
            echo "::error::Merged package version ${actual_version} does not match intended release ${NPM_VERSION}."
            exit 1
          fi

          npm ci
          npm run release:check
          diff_paths=(package.json package-lock.json manifest.json CHANGELOG.md)
          [[ -f index.ts ]] && diff_paths+=(index.ts)
          [[ -d src ]] && diff_paths+=(src)
          git diff --exit-code -- "${diff_paths[@]}"
          # `git diff` above compares dist against itself - nothing
          # rebuilds before this point, so it passes unconditionally and
          # cannot see untracked or ignored artifacts. Rebuild from clean
          # so a stale committed dist cannot ship.
          if git ls-files --error-unmatch 'dist' > /dev/null 2>&1; then
            rm -rf dist
            npm run build
            dist_status="$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')"
            if [[ -n "$dist_status" ]]; then
              echo "::error::Merged dist/ does not match a clean rebuild:"
              echo "$dist_status"
              exit 1
            fi
          fi

      - name: Publish npm package
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          # Idempotence guard: if the version already resolves on the registry,
          # treat the publish as already done and exit 0. This is what lets an
          # already-published release (e.g. 2026.8.10, which landed on npm while
          # main was still at 2026.8.7) reconcile instead of failing with a 403
          # when the workflow catches up and re-runs the transaction.
          if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
            echo "::notice::${pkg_name}@${NPM_VERSION} already published; skipping publish step."
            exit 0
          fi
          publish_with_provenance() {
            npm publish --access public --provenance --ignore-scripts
          }
          publish_without_provenance() {
            echo "::warning::Falling back to publish WITHOUT --provenance after repeated 404 from npm registry."
            npm publish --access public --ignore-scripts
          }
          attempt=0
          max_attempts=3
          while (( attempt < max_attempts )); do
            attempt=$(( attempt + 1 ))
            if publish_with_provenance; then
              echo "Published with provenance on attempt ${attempt}."
              exit 0
            fi
            if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
              echo "::notice::Version landed despite reported error; treating as success."
              exit 0
            fi
            echo "Publish attempt ${attempt}/${max_attempts} failed; sleeping 30s before retry..."
            sleep 30
          done
          echo "::warning::All ${max_attempts} provenance publish attempts failed; trying once without provenance."
          if publish_without_provenance; then
            echo "Published without provenance."
            exit 0
          fi
          if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
            echo "::notice::Version landed during fallback; treating as success."
            exit 0
          fi
          echo "::error::Publish failed after retries and provenance fallback."
          exit 1

      # Tag the exact merged/verified main commit AFTER a successful publish.
      # main is already advanced by the protected-PR merge above, so this step
      # only creates and pushes the tag - it never pushes HEAD:main again (that
      # push was what branch protection rejected with GH006, killing the job
      # before the tag push in the old ordering). If publication fails, main
      # retains the prepared metadata and the next run resumes the same version
      # instead of inventing another release.
      - name: Push release tag
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          # Consult the remote, not just the local tag database. The last tag
          # fetch happened back in `Decide release`; if anything created this
          # tag on origin since then, the local lookup misses it, `git tag`
          # succeeds locally and the push below is rejected as non-fast-forward
          # - after a successful publish, which is the npm-ahead-of-git state
          # this workflow exists to prevent.
          git fetch origin --force --tags
          remote_tag_sha="$(git ls-remote --refs --tags origin "refs/tags/${release_tag}" | awk 'NR == 1 { print $1 }')"
          current_sha="$(git rev-parse HEAD)"
          if [[ -n "$remote_tag_sha" ]]; then
            remote_commit="$(git rev-list -n 1 "$remote_tag_sha")"
            if [[ "$remote_commit" != "$current_sha" ]]; then
              echo "::error::${release_tag} already exists on origin at ${remote_commit}, not verified main ${current_sha}."
              exit 1
            fi
            echo "::notice::${release_tag} is already on origin at the verified commit; nothing to push."
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" > /dev/null; then
            existing_sha="$(git rev-list -n 1 "$release_tag")"
            current_sha="$(git rev-parse HEAD)"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "::error::${release_tag} already points to ${existing_sha}, not verified main ${current_sha}."
              exit 1
            fi
          else
            git tag "$release_tag"
          fi
          git push origin "refs/tags/${release_tag}"

      - name: Verify bun install of published package
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="${{ steps.decide.outputs.npm_version }}"
          mkdir -p /tmp/bun-verify
          cd /tmp/bun-verify
          rm -rf node_modules bun.lockb package.json
          bun init -y > /dev/null
          # Smoke-test that the just-published version installs via bun.
          # Retry to absorb npm registry propagation (~60s typical).
          for attempt in 1 2 3 4 5 6 7 8; do
            if bun add "${pkg_name}@${pkg_version}"; then
              echo "bun add succeeded on attempt $attempt"
              exit 0
            fi
            echo "bun add failed on attempt $attempt, sleeping 30s..."
            sleep 30
          done
          # bun's registry mirror can lag well past npm's own propagation,
          # especially for prerelease (-N) versions. The npm registry is
          # authoritative for what we just published: if it confirms the
          # version, the release genuinely succeeded and the bun failure is
          # mirror lag, not a publish failure. Do not let it block the
          # GitHub release / post-publish steps that follow.
          echo "bun could not resolve ${pkg_name}@${pkg_version}; checking npm registry authoritatively..."
          if npm view "${pkg_name}@${pkg_version}" version --registry="https://registry.npmjs.org" > /dev/null 2>&1; then
            echo "::warning::bun has not mirrored ${pkg_name}@${pkg_version} yet, but npm confirms it is published (registry mirror lag). Treating verification as successful."
            exit 0
          fi
          echo "npm registry does not show ${pkg_name}@${pkg_version} - real publish failure."
          exit 1
      - name: Create GitHub release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.decide.outputs.tag }}" --title "${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}" --notes-file RELEASE_NOTES.md --verify-tag