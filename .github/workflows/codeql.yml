name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.agents/pm/**'
      - '!**/*.md'
      - '!docs/**'
      - '!package-lock.json'
      - '.agents/pm/**/*.mjs'
      - '.agents/pm/**/*.cjs'
      - '.agents/pm/**/*.js'
      - '.agents/pm/**/*.ts'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!.agents/pm/**'
      - '!**/*.md'
      - '!docs/**'
      - '!package-lock.json'
      - '.agents/pm/**/*.mjs'
      - '.agents/pm/**/*.cjs'
      - '.agents/pm/**/*.js'
      - '.agents/pm/**/*.ts'
  schedule:
    # Weekly CodeQL scan. The minute/hour slot is unique to this repository so
    # the pm fleet does not fire every scan against the API in the same minute.
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    if: github.repository == 'unbraind/pm-vcs'
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          # This package is analyzed from source without a compiled build.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:javascript-typescript"
