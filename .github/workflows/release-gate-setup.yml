name: Enable gated release workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-gate-setup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    # Only merged main may activate the schedule; publication keeps its approval gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Verify the release stays behind maintainer approval
        run: node --test test/release-approval.test.ts
      - name: Enable the verified release schedule
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not activate a newer main than the guarded source just verified.
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable"
