# Gated GitHub issues -> pm tracker sync. The audited pipeline lives in pm-github;
# this caller only owns the schedule. Requires Settings -> Actions -> "Allow GitHub
# Actions to create and approve pull requests" (enabled by the orchestrator).
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write # the failure alert job opens, updates and closes its tracking issue
  actions: write
jobs:
  gated-sync:
    if: github.repository == 'unbraind/pm-vcs'
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@3e453a856a0327acf6cc241ad6a15179b5ee9c54 # pm-github 2026.11.25
